name: rumahl-oidc-nextcloud-e2e

services:
  database:
    image: ${MARIADB_IMAGE:?Use a preloaded, pinned MariaDB image}
    environment:
      MARIADB_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD:?Set the disposable test DB root password}
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?Set the disposable test DB password}
    volumes:
      - database:/var/lib/mysql

  nextcloud:
    image: ${NEXTCLOUD_IMAGE:?Use a preloaded Nextcloud image containing user_oidc}
    depends_on:
      - database
    environment:
      MYSQL_HOST: database
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?Set the disposable test DB password}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?Set a disposable admin username}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Set a disposable admin password}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_HOST:?Set the HTTPS Nextcloud hostname}
      OVERWRITEHOST: ${NEXTCLOUD_HOST:?Set the HTTPS Nextcloud hostname}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: ${NEXTCLOUD_ORIGIN:?Set the HTTPS Nextcloud origin}
    ports:
      - "127.0.0.1:${NEXTCLOUD_HTTP_PORT:-8080}:80"
    volumes:
      - nextcloud:/var/www/html

volumes:
  database:
  nextcloud:
