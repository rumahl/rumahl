# Include inside nginx's http {}. Provision a trusted local certificate first.
map $http_upgrade $rumahl_connection {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=rumahl_login:1m rate=5r/m;
upstream rumahl_platform {
    server unix:/run/rumahl-platform/gateway.sock;
}
server {
    listen 443 ssl;
    server_name rumahl.home.arpa;
    ssl_certificate /etc/rumahl/tls/fullchain.pem;
    ssl_certificate_key /etc/rumahl/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != rumahl.home.arpa) { return 421; }
    client_max_body_size 16k;
    client_body_timeout 10s;
    # No request URI, cookies, form fields or OIDC codes in access logs.
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location /assets/ {
        root /usr/share/rumahl/frontend/packages/shell/dist;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /login {
        limit_req zone=rumahl_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/rumahl-proxy.inc;
    }
    location / {
        include /etc/nginx/rumahl-proxy.inc;
    }
}
