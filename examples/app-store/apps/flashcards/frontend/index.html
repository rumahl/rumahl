<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8eef0;background:radial-gradient(circle at 15% 10%,#24444d,#101719 60%);padding:2rem}main{max-width:760px;margin:auto}h1{font:600 2rem/1.1 Georgia,serif;margin:.2rem 0 .3rem}p.lead{color:#a9b7ba;margin:0 0 1.4rem}section{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:1.1rem;margin-bottom:1rem}input,textarea,button,select{font:inherit}input,textarea,select{width:100%;padding:.7rem .8rem;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(0,0,0,.22);color:inherit}textarea{min-height:120px;resize:vertical}button{padding:.62rem .9rem;border:0;border-radius:10px;background:#5cc8a0;color:#061310;font-weight:750;cursor:pointer}button.secondary{background:rgba(255,255,255,.13);color:inherit}button.danger{background:#d56b62;color:#fff}.row{display:flex;gap:.6rem;flex-wrap:wrap}.row>*{flex:1 1 130px}.list{display:grid;gap:.5rem;margin-top:.8rem}.item{display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:.65rem .75rem;border-radius:10px;background:rgba(0,0,0,.2)}.item.done span{opacity:.5;text-decoration:line-through}.muted{color:#a9b7ba;font-size:.9rem}.stat{font:700 2.4rem/1 Georgia,serif;color:#8fe3c1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem}.card{padding:.85rem;border-radius:12px;background:rgba(0,0,0,.2)}small{color:#9fb0b3}a{color:#8fe3c1}</style>
<body>
<main>
<header><h1>Flashcards</h1><p class="lead">Study a deck of question-and-answer cards.</p></header>
<section><div class="row"><input id="front" placeholder="Question"><input id="back" placeholder="Answer"><button id="add">Add</button></div></section><section style="text-align:center"><div class="card" id="card" style="min-height:150px;display:grid;place-items:center;font-size:1.2rem">Add a card to begin.</div><div class="row" style="margin-top:.8rem"><button id="flip">Flip</button><button class="secondary" id="next">Next</button></div><p class="muted" id="progress"></p></section>
</main>
<script>let cards=JSON.parse(localStorage.getItem('rumahl.flashcards')||'[]'),index=0,flipped=false;
const card=document.querySelector('#card'),progress=document.querySelector('#progress');
function show(){if(!cards.length){card.textContent='Add a card to begin.';progress.textContent='';return;}const item=cards[index%cards.length];card.textContent=flipped?item.back:item.front;progress.textContent='Card '+(index%cards.length+1)+' of '+cards.length;}
document.querySelector('#add').onclick=()=>{const front=document.querySelector('#front').value.trim(),back=document.querySelector('#back').value.trim();if(!front||!back)return;cards.push({front,back});localStorage.setItem('rumahl.flashcards',JSON.stringify(cards));document.querySelector('#front').value='';document.querySelector('#back').value='';flipped=false;index=cards.length-1;show();};
document.querySelector('#flip').onclick=()=>{flipped=!flipped;show();};
document.querySelector('#next').onclick=()=>{index=(index+1)%Math.max(1,cards.length);flipped=false;show();};
show();</script>
</body>
</html>
