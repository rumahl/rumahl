# The platform service owns the user and app trees on the data disk. The
# runtime supervisor only needs group traversal of the app tree, and the
# service needs group write so it can create accounts' homes and app data
# directories after the data volume has been provisioned.
d /var/home 2770 root rumahl-apps -
d /var/apps 2770 root rumahl-apps -
# The unprivileged platform creates one private directory per installed app.
# The data disk is provisioned root-owned, so hand the app tree to the platform
# account at boot. z adjusts an existing (bind-mounted) directory.
z /apps 0770 rumahl-platform rumahl-web - -
