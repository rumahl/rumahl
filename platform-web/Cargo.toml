[package]
name = "rumahl-platform-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.9"
rumahl-core = { path = "../core" }
rumahl-oidc-provider = { path = "../oidc-provider" }
rumahl-platform-api = { path = "../platform-api" }
rumahl-ui-contracts = { path = "../ui-contracts" }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time", "sync", "io-util", "macros"] }
tokio-tungstenite = "0.29"
url = "2"
uuid = "1"
zeroize = "1"

[dev-dependencies]
rumahl-persistence-sqlite = { path = "../persistence-sqlite" }
sha2 = "0.11.0"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
