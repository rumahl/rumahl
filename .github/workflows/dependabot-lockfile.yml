name: Dependabot lockfile sync

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  update-lockfile:
    name: Refresh pnpm lockfile
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check changed paths
        id: changes
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > "${RUNNER_TEMP}/changed-files.txt"
          if grep -qE '^frontend/' "${RUNNER_TEMP}/changed-files.txt"; then
            echo "frontend=true" >> "${GITHUB_OUTPUT}"
          else
            echo "frontend=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Install pinned pnpm
        if: steps.changes.outputs.frontend == 'true'
        run: npm install --global pnpm@11.19.0

      - name: Regenerate lockfile
        id: lockfile
        if: steps.changes.outputs.frontend == 'true'
        run: |
          set -euo pipefail
          workspace="${RUNNER_TEMP}/lockfile"
          mkdir -p "${workspace}"
          gh api --paginate "repos/${REPO}/git/trees/${HEAD_SHA}?recursive=1" \
            --jq '.tree[] | select(.type == "blob") | .path | select(test("^frontend/(package\\.json|pnpm-workspace\\.yaml|pnpm-lock\\.yaml|packages/[^/]+/package\\.json)$"))' \
            > "${RUNNER_TEMP}/manifest-files.txt"
          while IFS= read -r file; do
            mkdir -p "${workspace}/$(dirname "${file}")"
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/${REPO}/contents/${file}?ref=${HEAD_SHA}" > "${workspace}/${file}"
          done < "${RUNNER_TEMP}/manifest-files.txt"
          cp "${workspace}/frontend/pnpm-lock.yaml" "${RUNNER_TEMP}/pnpm-lock.before.yaml"
          cd "${workspace}/frontend"
          pnpm install --lockfile-only --ignore-scripts
          if cmp -s pnpm-lock.yaml "${RUNNER_TEMP}/pnpm-lock.before.yaml"; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit refreshed lockfile
        if: steps.lockfile.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/lockfile
        env:
          COMMIT_MESSAGE: |
            chore(deps): refresh pnpm lockfile

            Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
        run: |
          set -euo pipefail
          lockfile="frontend/pnpm-lock.yaml"
          current_sha="$(gh api "repos/${REPO}/contents/${lockfile}?ref=${HEAD_SHA}" --jq '.sha')"
          payload="${RUNNER_TEMP}/commit.json"
          jq -n \
            --arg message "${COMMIT_MESSAGE}" \
            --arg content "$(base64 -w0 "${lockfile}")" \
            --arg sha "${current_sha}" \
            --arg branch "${HEAD_REF}" \
            '{message: $message, content: $content, sha: $sha, branch: $branch}' \
            > "${payload}"
          gh api --method PUT "repos/${REPO}/contents/${lockfile}" --input "${payload}" > /dev/null
          gh workflow run ci.yml --ref "${HEAD_REF}"
