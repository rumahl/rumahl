<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stopwatch</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e8eef0;background:radial-gradient(circle at 15% 10%,#24444d,#101719 60%);padding:2rem}main{max-width:760px;margin:auto}h1{font:600 2rem/1.1 Georgia,serif;margin:.2rem 0 .3rem}p.lead{color:#a9b7ba;margin:0 0 1.4rem}section{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:1.1rem;margin-bottom:1rem}input,textarea,button,select{font:inherit}input,textarea,select{width:100%;padding:.7rem .8rem;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(0,0,0,.22);color:inherit}textarea{min-height:120px;resize:vertical}button{padding:.62rem .9rem;border:0;border-radius:10px;background:#5cc8a0;color:#061310;font-weight:750;cursor:pointer}button.secondary{background:rgba(255,255,255,.13);color:inherit}button.danger{background:#d56b62;color:#fff}.row{display:flex;gap:.6rem;flex-wrap:wrap}.row>*{flex:1 1 130px}.list{display:grid;gap:.5rem;margin-top:.8rem}.item{display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:.65rem .75rem;border-radius:10px;background:rgba(0,0,0,.2)}.item.done span{opacity:.5;text-decoration:line-through}.muted{color:#a9b7ba;font-size:.9rem}.stat{font:700 2.4rem/1 Georgia,serif;color:#8fe3c1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem}.card{padding:.85rem;border-radius:12px;background:rgba(0,0,0,.2)}small{color:#9fb0b3}a{color:#8fe3c1}</style>
<body>
<main>
<header><h1>Stopwatch</h1><p class="lead">Precise stopwatch with laps.</p></header>
<section style="text-align:center"><div class="stat" id="time" style="font-size:3.4rem">00:00.00</div><div class="row" style="margin-top:1rem;justify-content:center"><button id="toggle">Start</button><button class="secondary" id="lap">Lap</button><button class="secondary" id="reset">Reset</button></div></section><div class="list" id="laps"></div>
</main>
<script>let started=0,elapsed=0,running=false,frame=0,laps=[];
const time=document.querySelector('#time');
function format(ms){const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),cs=Math.floor(ms%1000/10);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0');}
function render(){time.textContent=format(elapsed+(running?performance.now()-started:0));if(running)frame=requestAnimationFrame(render);}
document.querySelector('#toggle').onclick=event=>{if(running){elapsed+=performance.now()-started;running=false;cancelAnimationFrame(frame);event.target.textContent='Start';}else{started=performance.now();running=true;event.target.textContent='Stop';render();}};
document.querySelector('#lap').onclick=()=>{laps.unshift(time.textContent);const item=document.createElement('div');item.className='item';item.innerHTML='<span>Lap '+laps.length+'</span><span>'+time.textContent+'</span>';document.querySelector('#laps').prepend(item);};
document.querySelector('#reset').onclick=()=>{running=false;cancelAnimationFrame(frame);elapsed=0;document.querySelector('#toggle').textContent='Start';document.querySelector('#laps').innerHTML='';time.textContent='00:00.00';};
render();</script>
</body>
</html>
