name: Buildroot — check for updates

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildroot-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check official Buildroot releases and update pin
        id: check
        shell: bash
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          pin = Path('platform-buildroot/image/buildroot-source.json')
          current = json.loads(pin.read_text(encoding='utf-8'))
          # Official release archive index. Ignore release candidates and non-quarterly snapshots.
          index_url = 'https://buildroot.org/downloads/'
          request = urllib.request.Request(index_url, headers={'User-Agent': 'rumahl-buildroot-updater/1.0'})
          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode('utf-8', errors='replace')
          versions = set(re.findall(r'buildroot-(20\d{2}\.(?:02|05|08|11)(?:\.\d+)?)\.tar\.gz(?:["<\s])', html))
          if not versions:
              raise SystemExit('No official stable releases discovered; refusing to change pin')
          def key(version):
              parts = [int(p) for p in version.split('.')]
              return (parts[0], parts[1], parts[2] if len(parts) > 2 else 0)
          latest = max(versions, key=key)
          old = current['version']
          if key(latest) <= key(old):
              print(f'Already up to date: {old}; latest: {latest}')
              changed = False
          else:
              url = f'https://buildroot.org/downloads/buildroot-{latest}.tar.gz'
              sha = hashlib.sha256()
              request = urllib.request.Request(url, headers={'User-Agent': 'rumahl-buildroot-updater/1.0'})
              with urllib.request.urlopen(request, timeout=120) as response:
                  while chunk := response.read(1024 * 1024):
                      sha.update(chunk)
              current.update(version=latest, url=url, sha256=sha.hexdigest())
              pin.write_text(json.dumps(current, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              print(f'Updated {old} -> {latest}; SHA-256: {sha.hexdigest()}')
              changed = True
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print(f'changed={str(changed).lower()}', file=out)
              print(f'version={latest}', file=out)
          PY

      # A GitHub App installation token allows PR validation workflows to trigger.
      - name: Generate GitHub App installation token
        if: steps.check.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BUILDROOT_APP_ID }}
          private-key: ${{ secrets.BUILDROOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update Buildroot PR
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/buildroot-update
          delete-branch: true
          commit-message: 'build(buildroot): update to ${{ steps.check.outputs.version }}'
          title: 'build(buildroot): update to ${{ steps.check.outputs.version }}'
          body: |
            Automated Buildroot release update from https://buildroot.org/downloads/.

            - Updates version, official download URL, and SHA-256 of the downloaded tarball.
            - Keeps the existing `prototypeReference` field.
            - Validation must pass before manual review and merge.

            **Note:** The SHA-256 is computed over HTTPS; it is not an independently authenticated upstream signature.
          add-paths: platform-buildroot/image/buildroot-source.json
