# Rust dependency policy for rumahl. This does not cover frontend packages
# or replace the notices required when distributing third-party components.
[graph]
all-features = true

[advisories]
# No blanket exemptions for security advisories.
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[licenses.private]
# Internal workspace crates currently use publish = false and have no
# package-level license metadata. External dependencies are still checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []