[package]
name = "rumahl-persistence-sqlite"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["bundled"]
bundled = ["rusqlite/bundled"]

[dependencies]
rumahl-core = { path = "../core" }
rusqlite = { version = "0.40.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
