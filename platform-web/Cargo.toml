[package]
name = "rumahl-platform-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.9"
rumahl-core = { path = "../core" }
rumahl-platform-api = { path = "../platform-api" }
rumahl-ui-contracts = { path = "../ui-contracts" }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time", "sync", "io-util", "macros"] }
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
