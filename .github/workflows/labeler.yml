name: Label pull requests

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    name: Label pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No checkout: actions/labeler only reads the changed file list via the API.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
