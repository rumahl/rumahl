name: Buildroot — check for updates

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildroot-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check official Buildroot releases and update pin
        id: check
        shell: bash
        run: |
          python3 <<'PY'
          import hashlib
          import http.client
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          # buildroot.org (lighttpd) truncates the release index over HTTP/1.x:
          # the response advertises 396051 bytes but closes after 390929.
          # Resume interrupted transfers with Range requests instead of letting
          # a single early EOF fail the scheduled job.
          def fetch_bytes(url, *, timeout=120, attempts=6):
              data = b''
              for attempt in range(1, attempts + 1):
                  headers = {'User-Agent': 'rumahl-buildroot-updater/1.0'}
                  if data:
                      headers['Range'] = f'bytes={len(data)}-'
                  try:
                      request = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(request, timeout=timeout) as response:
                          chunk = response.read()
                          if data and response.status != 206:
                              # The server ignored the range: start over.
                              data = b''
                          data += chunk
                      return data
                  except http.client.IncompleteRead as failure:
                      data += failure.partial
                      print(f'{url}: interrupted at {len(data)} bytes; resuming', flush=True)
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as failure:
                      print(f'{url}: {failure}; retrying ({attempt}/{attempts})', flush=True)
                  time.sleep(min(2 ** attempt, 15))
              raise SystemExit(f'Unable to download {url} after {attempts} attempts')

          pin = Path('platform-buildroot/image/buildroot-source.json')
          current = json.loads(pin.read_text(encoding='utf-8'))
          # Official release archive index. Ignore release candidates and non-quarterly snapshots.
          index_url = 'https://buildroot.org/downloads/'
          html = fetch_bytes(index_url, timeout=60).decode('utf-8', errors='replace')
          versions = set(re.findall(r'buildroot-(20\d{2}\.(?:02|05|08|11)(?:\.\d+)?)\.tar\.gz(?:["<\s])', html))
          if not versions:
              raise SystemExit('No official stable releases discovered; refusing to change pin')
          def key(version):
              parts = [int(p) for p in version.split('.')]
              return (parts[0], parts[1], parts[2] if len(parts) > 2 else 0)
          latest = max(versions, key=key)
          old = current['version']
          if key(latest) <= key(old):
              print(f'Already up to date: {old}; latest: {latest}')
              changed = False
          else:
              url = f'https://buildroot.org/downloads/buildroot-{latest}.tar.gz'
              sha = hashlib.sha256(fetch_bytes(url, timeout=300))
              current.update(version=latest, url=url, sha256=sha.hexdigest())
              pin.write_text(json.dumps(current, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              print(f'Updated {old} -> {latest}; SHA-256: {sha.hexdigest()}')
              changed = True
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print(f'changed={str(changed).lower()}', file=out)
              print(f'version={latest}', file=out)
          PY

      # A GitHub App installation token allows PR validation workflows to trigger.
      - name: Generate GitHub App installation token
        if: steps.check.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BUILDROOT_APP_ID }}
          private-key: ${{ secrets.BUILDROOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update Buildroot PR
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/buildroot-update
          delete-branch: true
          signoff: true
          commit-message: 'build(buildroot): update to ${{ steps.check.outputs.version }}'
          title: 'build(buildroot): update to ${{ steps.check.outputs.version }}'
          body: |
            Automated Buildroot release update from https://buildroot.org/downloads/.

            - Updates version, official download URL, and SHA-256 of the downloaded tarball.
            - Keeps the existing `prototypeReference` field.
            - Validation must pass before manual review and merge.

            **Note:** The SHA-256 is computed over HTTPS; it is not an independently authenticated upstream signature.
          add-paths: platform-buildroot/image/buildroot-source.json
