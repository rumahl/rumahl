[build]
  command = "pnpm build:demo"
  publish = "dist-demo"

[[redirects]]
  from = "/apps/*"
  to = "/demo-widget.html"
  status = 200

[[redirects]]
  from = "/widgets/*"
  to = "/demo-widget.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apps/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/widgets/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
